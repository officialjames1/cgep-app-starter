name: grc-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write       # required for AWS OIDC + Cosign keyless (Sigstore)
  contents: read
  pull-requests: write  # required to comment on the PR

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform
  TF_VARS: >-
    -var="project_name=acme-health"
    -var="environment=dev"
    -var="github_org=officialjames1"
    -var="github_repo=cgep-app-starter"

jobs:
  # Runs on every PR and every push to main: plan + policy gate only.
  # Never applies here — infrastructure changes only land via the apply job
  # below, which is gated on push-to-main (i.e., after a PR has merged).
  plan-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Install Conftest
        run: |
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.50.0/conftest_0.50.0_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin conftest

      - name: Install tfsec
        run: |
          curl -fsSL https://github.com/aquasecurity/tfsec/releases/download/v1.28.14/tfsec-linux-amd64 \
            -o /usr/local/bin/tfsec && chmod +x /usr/local/bin/tfsec

      - name: Terraform init + validate + plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false
          terraform validate
          terraform plan -out=tfplan -input=false -no-color ${{ env.TF_VARS }} | tee plan.txt

      - name: Policy gate (conftest via policy-gate.sh)
        id: conftest
        run: ./scripts/policy-gate.sh --workspace "$TF_WORKING_DIR"

      - name: tfsec scan (informational — deferred GAP-05/06/WAF findings expected)
        id: tfsec
        if: always()
        run: |
          mkdir -p evidence/lab-3-4
          tfsec "$TF_WORKING_DIR" --format sarif --out evidence/lab-3-4/tfsec.sarif || true
          tfsec "$TF_WORKING_DIR" --minimum-severity CRITICAL

      - name: Upload plan + policy evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grc-plan-evidence-${{ github.run_id }}
          path: |
            evidence/lab-3-4/
            ${{ env.TF_WORKING_DIR }}/plan.txt
          retention-days: 90

  # Runs only on push to main (i.e., after a PR has been reviewed and merged):
  # re-applies the already-gated plan, then bundles, signs, and vaults evidence.
  apply-and-sign:
    needs: plan-and-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Terraform init + plan + apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false
          terraform plan -out=tfplan -input=false -no-color ${{ env.TF_VARS }} | tee plan.txt
          terraform show -json tfplan > plan.json
          terraform apply -input=false -auto-approve tfplan

      - name: Copy plan into evidence
        run: |
          mkdir -p evidence/lab-3-4
          cp "$TF_WORKING_DIR"/plan.json evidence/lab-3-4/plan.json
          cp "$TF_WORKING_DIR"/plan.txt  evidence/lab-3-4/plan.txt

      - name: Bundle + sign + upload to vault
        id: sign
        env:
          VAULT: ${{ vars.EVIDENCE_VAULT }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then SHASUM="sha256sum"
          elif command -v shasum >/dev/null 2>&1; then SHASUM="shasum -a 256"
          else echo "Need sha256sum or shasum" >&2; exit 2; fi

          BUNDLE="evidence-${RUN_ID}-${SHA}.tar.gz"
          ( cd evidence/lab-3-4 && tar czf "../../${BUNDLE}" . )
          $SHASUM "${BUNDLE}" | awk '{print $1}' > "${BUNDLE}.sha256"

          cosign sign-blob --yes --bundle "${BUNDLE}.sig.bundle" "${BUNDLE}"

          KEY_PREFIX="runs/${RUN_ID}"
          aws s3 cp "${BUNDLE}"            "s3://${VAULT}/${KEY_PREFIX}/${BUNDLE}"
          aws s3 cp "${BUNDLE}.sha256"     "s3://${VAULT}/${KEY_PREFIX}/${BUNDLE}.sha256"
          aws s3 cp "${BUNDLE}.sig.bundle" "s3://${VAULT}/${KEY_PREFIX}/${BUNDLE}.sig.bundle"

          VERSION_ID=$(aws s3api head-object --bucket "${VAULT}" --key "${KEY_PREFIX}/${BUNDLE}" --query VersionId --output text)
          cat > receipt.json <<EOF
          {
            "run_id":"${RUN_ID}",
            "vault":"${VAULT}",
            "bundle_key":"${KEY_PREFIX}/${BUNDLE}",
            "version_id":"${VERSION_ID}",
            "sha256":"$(cat ${BUNDLE}.sha256)",
            "commit":"${SHA}"
          }
          EOF
          aws s3 cp receipt.json "s3://${VAULT}/${KEY_PREFIX}/receipt.json"

      - name: Upload signed bundle as artifact (independently verifiable by graders)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-evidence-bundle-${{ github.run_id }}
          path: |
            evidence-${{ github.run_id }}-${{ github.sha }}.tar.gz
            evidence-${{ github.run_id }}-${{ github.sha }}.tar.gz.sha256
            evidence-${{ github.run_id }}-${{ github.sha }}.tar.gz.sig.bundle
          retention-days: 90

      - name: Verify evidence chain
        id: verify
        run: bash scripts/verify-evidence.sh "${{ github.run_id }}" --vault "${{ vars.EVIDENCE_VAULT }}"

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grc-evidence-${{ github.run_id }}
          path: evidence/lab-3-4/
          retention-days: 90
